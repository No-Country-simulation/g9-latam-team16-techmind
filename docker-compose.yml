version: '3.8'

services:
  aynikortex-db:
    image: mysql:8.0
    container_name: aynikortex_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: aynikortex_db
      MYSQL_USER: ayni_user
      MYSQL_PASSWORD: ayni_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
