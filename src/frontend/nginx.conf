server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${BACKEND_URL}/api/v1/;

        proxy_http_version 1.1;

        proxy_set_header Origin "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}